<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 496"><style>.head{animation:nod 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}g:nth-of-type(2) .head{animation-delay:-.8s}g:nth-of-type(3) .head{animation-delay:-1.6s}@keyframes nod{50%{transform:translateY(-4px) rotate(-3deg)}}@media (prefers-reduced-motion:reduce){.head{animation:none}}</style>
        <defs>
          <radialGradient id="rb-dome" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f4f7fb"/><stop offset=".6" stop-color="#b9c2d2"/><stop offset="1" stop-color="#6c768a"/></radialGradient>
