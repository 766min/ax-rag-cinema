[project]
name = "ax-rag-cinema"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# 로컬 재정렬기 (C · C+ 구성). 기본 설치 · CI 에는 들어가지 않는다 — 둘 중 하나만 고른다 (README 설치 참고)
#   rerank       : CPU · macOS(MPS) 용. Linux · Windows 는 PyTorch CPU 저장소, macOS 는 PyPI 에서 torch 를 받는다
#   rerank-cu128 : NVIDIA GPU 용. Linux · Windows 는 CUDA 12.8 torch, macOS 는 PyPI torch 로 대신한다
rerank = [
    "sentence-transformers==5.2.0",
    "torch==2.11.0",
]
rerank-cu128 = [
    "sentence-transformers==5.2.0",
    "torch==2.11.0",
]

[tool.pytest.ini_options]
# src 를 import 루트로 써서 테스트에서도 from shared.core ... 로 가져온다
pythonpath = ["src"]
# 테스트는 tests/ 에서만 찾는다. CI 의 실행 조건(ci.yml 의 hashFiles('tests/**'))과 범위를 맞추고,
# data/ 같은 git 밖 폴더의 test_*.py 를 로컬 pytest 가 줍지 않게 한다 (#9 리뷰)
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, UP: 최신 문법 권장
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # 줄 길이는 ruff format 이 맞춘다 (한글 주석이 길어 오탐이 많다)
    "UP046",  # Generic[T] -> class Foo[T] 문법 변경은 강제하지 않는다
    "UP047",
]

[tool.mypy]
python_version = "3.13"
# src 를 import 루트로 인식시킨다 (pytest 의 pythonpath 와 같은 의미)
mypy_path = "src"
explicit_package_bases = true
# langchain 등 타입 정보가 느슨한 라이브러리 때문에 처음에는 완화해서 시작한다
ignore_missing_imports = true
warn_unused_ignores = true

[tool.uv]
# 두 재정렬 그룹은 torch 를 서로 다른 저장소에서 받으므로 함께 설치할 수 없다
conflicts = [
    [{ group = "rerank" }, { group = "rerank-cu128" }],
]

# torch 저장소: 그룹마다 따로 고른다. macOS 는 두 그룹 모두 PyPI torch (MPS 지원) 를 쓴다
#   cu128 저장소에는 macOS 휠이 없으므로 모든 플랫폼 공통 경로로 쓰지 않는다
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "rerank", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", group = "rerank-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
