# 배포용: DB + API(화면 포함) + Caddy(HTTPS). 실행 방법은 docs/deploy.md
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 넣으세요}
      POSTGRES_DB: rag_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # 포트를 밖에 열지 않는다 (API 만 같은 네트워크에서 접속)

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/rag_db
      CORS_ORIGINS: "" # 화면과 API 가 같은 주소라 필요 없다
    volumes:
      - ./data:/app/data:ro # 데이터셋 · 별칭 (이미지에는 없음)
      - hf-cache:/app/hf-cache # 재정렬 모델 (처음 한 번만 받는다)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  hf-cache:
